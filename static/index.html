<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f23; --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --bot:#eef0f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1a1d23; --text:#e6e8eb; --muted:#9aa1ab; --accent:#3b82f6; --user:#3b82f6; --bot:#262a31; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; background: var(--card); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--bot); font-weight: 600; }
  header span { color: var(--muted); font-weight: 400; font-size: 13px; display: block; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; font-size: 15px; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .typing { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  .chip { border: 1px solid var(--bot); background: transparent; color: var(--text); padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--bot); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  input { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--bot); background: var(--bg); color: var(--text); font-size: 16px; }
  button.send { padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>Shopping Assistant<span>Tell me what you're looking for and your budget.</span></header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips">
    <button class="chip">Warm gear for winter hiking under $200</button>
    <button class="chip">Gift ideas for a coffee lover</button>
    <button class="chip">Budget-friendly workout equipment</button>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" maxlength="1000" placeholder="e.g. running shoes under $100" required>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chips = document.getElementById("chips");
let sessionId = sessionStorage.getItem("sid");

function render(text) {
  // Escape first, then allow only **bold** and line breaks.
  const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
}
function add(role, text, cls = "") {
  const el = document.createElement("div");
  el.className = `msg ${role} ${cls}`;
  el.innerHTML = render(text);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
async function ask(message) {
  chips.style.display = "none";
  add("user", message);
  const typing = add("bot", "Thinking…", "typing");
  send.disabled = input.disabled = true;
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) { add("bot", data.detail || "Something went wrong. Please try again."); return; }
    sessionId = data.session_id;
    sessionStorage.setItem("sid", sessionId);
    add("bot", data.reply);
  } catch (e) {
    typing.remove();
    add("bot", "Network error. Please try again.");
  } finally {
    send.disabled = input.disabled = false;
    input.focus();
  }
}
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const m = input.value.trim();
  if (!m) return;
  input.value = "";
  ask(m);
});
chips.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => ask(c.textContent)));
add("bot", "Hi! I can help you find products from our catalog. What are you shopping for?");
</script>
</body>
</html>
